<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortuna Liebenau Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:#171717;background:#fff}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e5e5}
.bar{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.bar img{height:34px;display:block}
nav{display:flex;gap:34px}
nav a,.tel{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#404040}
.back{border-bottom:1px solid #e5e5e5}
.back div{max-width:1180px;margin:0 auto;padding:12px 24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#737373}
main{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
.tags{display:flex;gap:10px;margin-bottom:18px}
.tags span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#737373;padding:3px 8px}
.tags span:first-child{border:1px solid #d4d4d4}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:60px;line-height:1;color:#0a0a0a;max-width:820px}
.addr{margin-top:16px;font-size:14px;color:#525252;display:flex;align-items:center;gap:6px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#737373;margin:40px 0 12px}
.video{position:relative;background:#0a0a0a;aspect-ratio:16/9}
.video video{width:100%;height:100%;display:block;object-fit:cover}
.stage{position:relative;background:#f5f5f5;aspect-ratio:16/10;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:rgba(255,255,255,.9);font-size:20px;cursor:pointer}
.prev{left:16px}.next{right:16px}
.count{position:absolute;right:16px;bottom:14px;background:rgba(255,255,255,.9);font-size:11px;letter-spacing:.16em;padding:5px 9px;color:#404040}
.thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;opacity:.75;border:2px solid transparent;display:block}
.thumbs img.on,.thumbs img:hover{opacity:1;border-color:#0a0a0a}
@media(max-width:800px){nav,.tel{display:none}h1{font-size:38px}.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="bar"><img src="bilder/logo-fortuna.png" alt="Fortuna Immobilien"><nav><a>Kaufen</a><a>Verkaufen</a><a>Mieten</a><a>Webinar</a><a>Über uns</a></nav><span class="tel">+43 316 712 777</span></div></header>
<div class="back"><div>‹ Zurück zu den Einzelobjekten</div></div>
<main>
<div class="tags"><span>Kauf</span><span>Wohnung</span></div>
<h1>Mehr Terrasse als Wohnfläche: 4-Zimmer-Dachgeschosswohnung mit 86 m² Sonnenterrasse in Graz-Liebenau</h1>
<p class="addr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Liebenauer Hauptstraße 186, 8041 Graz</p>

<p class="label">Drohnenflug durch die Wohnung</p>
<div class="video">
<video controls muted autoplay loop playsinline poster="bilder/01.jpg">
<source src="Fortuna_Liebenau_Drohnenflug.mp4" type="video/mp4">
<source src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JxVjtC14DfZx4HI6N2F92ObKYl/c481128c-67e7-49d6-96ee-af842e385e35.mp4" type="video/mp4">
</video>
</div>

<p class="label">Fotos</p>
<div class="stage"><img id="big" src="bilder/01.jpg" alt=""><button class="nav prev" onclick="go(-1)">‹</button><button class="nav next" onclick="go(1)">›</button><span class="count" id="count">BILD 1 / 21</span></div>
<div class="thumbs" id="thumbs"></div>
</main>
<script>
const N=21,big=document.getElementById('big'),count=document.getElementById('count'),th=document.getElementById('thumbs');let cur=0;
const src=i=>'bilder/'+String(i+1).padStart(2,'0')+'.jpg';
for(let i=0;i<N;i++){const t=document.createElement('img');t.src=src(i);t.loading='lazy';t.onclick=()=>show(i);th.appendChild(t);}
function show(i){cur=(i+N)%N;big.src=src(cur);count.textContent='BILD '+(cur+1)+' / '+N;[...th.children].forEach((t,k)=>t.classList.toggle('on',k===cur));}
function go(d){show(cur+d)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
show(0);
</script>
</body>
</html>
